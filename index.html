<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKZ RADIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #08090d;
      --surface-1: rgba(18, 20, 28, 0.85);
      --surface-2: rgba(28, 32, 45, 0.6);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 0, 60, 0.4);
      --skz-crimson: #ff003c;
      --skz-glow: rgba(255, 0, 60, 0.45);
      --accent-cyan: #00f0ff;
      --text-primary: #ffffff;
      --text-secondary: #9499ad;
      --text-muted: #5a5f73;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-image: 
        radial-gradient(circle at 15% 0%, rgba(255, 0, 60, 0.16) 0%, transparent 50%),
        radial-gradient(circle at 85% 100%, rgba(0, 240, 255, 0.1) 0%, transparent 45%);
      display: flex;
      flex-direction: column;
    }

    .header-bar {
      height: 60px;
      padding: 0 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(8, 9, 13, 0.85);
      backdrop-filter: blur(16px);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-tag {
      background: linear-gradient(135deg, var(--skz-crimson), #990024);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 12px var(--skz-glow);
    }

    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .brand-name span {
      color: var(--skz-crimson);
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--skz-crimson);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: var(--skz-crimson);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--skz-crimson);
      animation: pulse 1.6s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 500px 1fr;
      gap: 24px;
      padding: 16px 32px 20px 32px;
      height: calc(100vh - 60px);
      min-height: 0;
    }

    .player-deck {
      background: var(--surface-1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 20px 24px 18px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .deck-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* CONTENEDOR CON EFECTOS KPOP DINÁMICOS */
    .cover-wrapper {
      width: 100%;
      max-width: 420px;
      height: min(340px, 39vh);
      border-radius: 22px;
      margin-bottom: 12px;
      position: relative;
      background: #0d0f17;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      object-fit: cover;
      transform: scale(1);
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Brillo de destello cyber que cruza la carátula */
    .cover-wrapper::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.12),
        rgba(0, 240, 255, 0.18),
        transparent
      );
      transform: rotate(25deg);
      opacity: 0;
      pointer-events: none;
    }

    /* ESTADO AL REPRODUCIR: Respiración rítmica y halo reactivo */
    .is-playing .cover-wrapper {
      border-color: rgba(255, 0, 60, 0.45);
      animation: kpopAura 3.6s infinite alternate ease-in-out;
    }

    .is-playing .cover-img {
      animation: kpopPulse 3.6s infinite alternate ease-in-out;
    }

    .is-playing .cover-wrapper::after {
      opacity: 1;
      animation: kpopSweep 4.5s infinite ease-in-out;
    }

    @keyframes kpopPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.035); }
    }

    @keyframes kpopAura {
      0% {
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 0, 60, 0.25);
      }
      100% {
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.85), 0 0 45px rgba(255, 0, 60, 0.5), 0 0 25px rgba(0, 240, 255, 0.25);
      }
    }

    @keyframes kpopSweep {
      0% { transform: translateX(0) rotate(25deg); }
      25%, 100% { transform: translateX(650px) rotate(25deg); }
    }

    .meta-mode {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 3px;
    }

    .title-marquee-container {
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      margin-bottom: 3px;
      mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
    }

    .meta-title {
      font-size: 21px;
      font-weight: 800;
      white-space: nowrap;
      display: inline-block;
      will-change: transform;
    }

    .meta-title.animate-marquee {
      animation: pingPongMarquee 10s ease-in-out infinite alternate;
    }

    @keyframes pingPongMarquee {
      0%, 15% { transform: translateX(0); }
      85%, 100% { transform: translateX(var(--scroll-distance, -50px)); }
    }

    .meta-artist {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .deck-bottom {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ECUALIZADOR DINÁMICO */
    .equalizer-canvas-container {
      width: 100%;
      height: 64px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: -4px;
    }

    #equalizerCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* TIMELINE DESLIZABLE */
    .timeline {
      width: 100%;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      touch-action: none;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--skz-crimson), #ff4d6d);
      border-radius: 10px;
      box-shadow: 0 0 12px var(--skz-crimson);
      pointer-events: none;
      position: relative;
    }

    .progress-thumb {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px var(--skz-crimson);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .progress-track:hover .progress-thumb,
    .progress-track.is-dragging .progress-thumb {
      opacity: 1;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 5px;
      font-variant-numeric: tabular-nums;
    }

    .playback-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .btn-step {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-step:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-step:active {
      transform: scale(0.94);
    }

    .btn-shuffle {
      color: var(--text-secondary);
    }

    .btn-shuffle.active {
      color: var(--accent-cyan);
      border-color: rgba(0, 240, 255, 0.5);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
    }

    .btn-play-hero {
      background: linear-gradient(135deg, var(--skz-crimson), #e60036);
      border: none;
      color: white;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 25px var(--skz-glow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-play-hero:hover {
      transform: scale(1.04);
      box-shadow: 0 10px 30px rgba(255, 0, 60, 0.55);
    }

    .btn-play-hero:active {
      transform: scale(0.95);
    }

    /* CONTROL DE VOLUMEN PROFESIONAL */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .vol-icon {
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: fill 0.2s;
    }

    .vol-icon:hover {
      fill: var(--text-primary);
    }

    .volume-slider {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: linear-gradient(to right, var(--skz-crimson) 85%, rgba(255, 255, 255, 0.1) 85%);
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      transition: background 0.1s linear;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 8px var(--skz-crimson);
      transition: transform 0.15s ease;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .library-panel {
      background: var(--surface-1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .tabs-group {
      display: flex;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .tab-item {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 8px 16px;
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-item.active {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .tab-pill {
      background: var(--skz-crimson);
      color: white;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
    }

    /* BARRA DE BÚSQUEDA CON BOTÓN X DE LIMPIEZA */
    .search-wrapper {
      position: relative;
      flex: 1;
      max-width: 320px;
      display: flex;
      align-items: center;
    }

    .search-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 9px 34px 9px 14px;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-field:focus {
      border-color: var(--border-focus);
    }

    .btn-clear-search {
      position: absolute;
      right: 8px;
      width: 20px;
      height: 20px;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      line-height: 1;
      transition: all 0.2s;
    }

    .btn-clear-search:hover {
      background: var(--skz-crimson);
      color: #ffffff;
    }

    .list-viewport {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding-right: 6px;
    }

    .list-viewport::-webkit-scrollbar {
      width: 5px;
    }
    .list-viewport::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .tracks-grid {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .track-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      transition: all 0.15s;
    }

    .track-row:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .row-main {
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: hidden;
    }

    .row-index {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 24px;
    }

    .row-details {
      overflow: hidden;
    }

    .row-name {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-add-queue {
      background: rgba(255, 0, 60, 0.12);
      border: 1px solid rgba(255, 0, 60, 0.3);
      color: #ff3366;
      font-family: inherit;
      font-weight: 700;
      font-size: 12px;
      padding: 7px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-add-queue:hover {
      background: var(--skz-crimson);
      border-color: var(--skz-crimson);
      color: #fff;
      box-shadow: 0 0 12px var(--skz-glow);
    }

    @media (max-width: 960px) {
      html, body {
        overflow: auto;
        height: auto;
      }
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
        padding: 16px;
        gap: 16px;
      }
      .player-deck {
        height: auto;
        gap: 16px;
      }
      .cover-wrapper {
        height: 300px;
      }
      .library-panel {
        height: 600px;
      }
      .panel-header {
        flex-direction: column;
        align-items: stretch;
      }
      .search-wrapper {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <div class="brand">
      <div class="brand-tag">SKZ</div>
      <div class="brand-name">RADIO</div>
    </div>
    <div class="live-status">
      <div class="pulse-dot"></div> EN VIVO
    </div>
  </header>

  <main class="workspace">
    <section class="player-deck" id="playerDeck">
      <div class="deck-top">
        <div class="cover-wrapper">
          <!-- Portada Vectorial Oficial SKZ en SVG nativo -->
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600' viewBox='0 0 600 600'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%231a0308'/><stop offset='50%25' stop-color='%2308090d'/><stop offset='100%25' stop-color='%23020b12'/></linearGradient><linearGradient id='glow' x1='0%25' y1='0%25' x2='100%25' y2='0%25'><stop offset='0%25' stop-color='%23ff003c'/><stop offset='100%25' stop-color='%2300f0ff'/></linearGradient></defs><rect width='600' height='600' fill='url(%23g)'/><circle cx='300' cy='300' r='230' stroke='%23ff003c' stroke-width='3' fill='none' opacity='0.25'/><circle cx='300' cy='300' r='180' stroke='%2300f0ff' stroke-width='2' stroke-dasharray='8 6' fill='none' opacity='0.3'/><path d='M230 200 L370 200 L390 230 L210 230 Z' fill='%23ff003c' opacity='0.8'/><text x='300' y='325' font-family='sans-serif' font-weight='900' font-size='56' fill='%23ffffff' text-anchor='middle' letter-spacing='4'>STRAY KIDS</text><text x='300' y='365' font-family='sans-serif' font-weight='800' font-size='22' fill='url(%23glow)' text-anchor='middle' letter-spacing='10'>RADIO STREAM</text><rect x='150' y='410' width='300' height='4' fill='url(%23glow)' rx='2'/><text x='300' y='445' font-family='sans-serif' font-weight='700' font-size='15' fill='%239499ad' text-anchor='middle' letter-spacing='3'>ATE • 5-STAR • ROCK-STAR</text></svg>" 
               id="coverImg" class="cover-img" alt="Stray Kids Cover">
        </div>
        <div class="meta-mode" id="modeIndicator">STANDBY // LISTO</div>
        
        <div class="title-marquee-container" id="marqueeBox">
          <div class="meta-title" id="trackTitle">Selecciona o pulsa Play</div>
        </div>

        <div class="meta-artist" id="trackArtist">Stray Kids</div>
      </div>

      <div class="deck-bottom">
        <!-- CANVAS DEL ECUALIZADOR DINÁMICO -->
        <div class="equalizer-canvas-container">
          <canvas id="equalizerCanvas"></canvas>
        </div>

        <!-- TIMELINE DESLIZABLE -->
        <div class="timeline">
          <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill">
              <div class="progress-thumb"></div>
            </div>
          </div>
          <div class="time-labels">
            <span id="labelCurrent">0:00</span>
            <span id="labelTotal">0:00</span>
          </div>
        </div>

        <!-- CONTROLES -->
        <div class="playback-controls">
          <button class="btn-step btn-shuffle active" id="btnShuffle" title="Modo Aleatorio Activo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
            </svg>
          </button>

          <button class="btn-step" id="btnPrev" title="Anterior">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          
          <button class="btn-play-hero" id="btnPlay" title="Reproducir / Pausar">
            <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          
          <button class="btn-step" id="btnNext" title="Siguiente canción">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>

        <!-- BARRA DE VOLUMEN PROFESIONAL -->
        <div class="volume-row">
          <svg class="vol-icon" id="volMuteBtn" viewBox="0 0 24 24">
            <path d="M7 9v6h4l5 5V4l-5 5H7z"/>
          </svg>
          <input type="range" class="volume-slider" id="volumeControl" min="0" max="1" step="0.01" value="0.85">
          <svg class="vol-icon" id="volMaxBtn" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </div>
      </div>
    </section>

    <!-- PANEL DERECHO -->
    <section class="library-panel">
      <div class="panel-header">
        <div class="tabs-group">
          <button class="tab-item active" id="tabCatalog">CATÁLOGO</button>
          <button class="tab-item" id="tabQueue">COLA <span class="tab-pill" id="queueBadge">0</span></button>
        </div>

        <div class="search-wrapper">
          <input type="text" class="search-field" id="searchField" placeholder="Buscar canción">
          <button class="btn-clear-search" id="btnClearSearch" title="Borrar búsqueda">✕</button>
        </div>
      </div>

      <div class="list-viewport">
        <ul class="tracks-grid" id="catalogView"></ul>
        <ul class="tracks-grid" id="queueView" style="display: none;"></ul>
      </div>
    </section>
  </main>

  <audio id="audioSource" preload="auto" crossorigin="anonymous"></audio>

  <script>
    let TRACKS = [];
    let currentTrack = null;
    let queue = [];
    let history = [];
    let isPlaying = false;
    let isShuffle = true;
    let isDragging = false;
    const coverCache = {};

    const audio = document.getElementById("audioSource");
    const playerDeck = document.getElementById("playerDeck");
    const coverImg = document.getElementById("coverImg");
    const marqueeBox = document.getElementById("marqueeBox");
    const trackTitle = document.getElementById("trackTitle");
    const trackArtist = document.getElementById("trackArtist");
    const modeIndicator = document.getElementById("modeIndicator");
    const progressTrack = document.getElementById("progressTrack");
    const progressFill = document.getElementById("progressFill");
    const labelCurrent = document.getElementById("labelCurrent");
    const labelTotal = document.getElementById("labelTotal");
    const btnPlay = document.getElementById("btnPlay");
    const playIcon = document.getElementById("playIcon");
    const btnNext = document.getElementById("btnNext");
    const btnPrev = document.getElementById("btnPrev");
    const btnShuffle = document.getElementById("btnShuffle");
    const volumeControl = document.getElementById("volumeControl");
    const volMuteBtn = document.getElementById("volMuteBtn");
    const volMaxBtn = document.getElementById("volMaxBtn");

    const tabCatalog = document.getElementById("tabCatalog");
    const tabQueue = document.getElementById("tabQueue");
    const catalogView = document.getElementById("catalogView");
    const queueView = document.getElementById("queueView");
    const queueBadge = document.getElementById("queueBadge");
    const searchField = document.getElementById("searchField");
    const btnClearSearch = document.getElementById("btnClearSearch");

    const DEFAULT_SVG_COVER = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600' viewBox='0 0 600 600'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%231a0308'/><stop offset='50%25' stop-color='%2308090d'/><stop offset='100%25' stop-color='%23020b12'/></linearGradient><linearGradient id='glow' x1='0%25' y1='0%25' x2='100%25' y2='0%25'><stop offset='0%25' stop-color='%23ff003c'/><stop offset='100%25' stop-color='%2300f0ff'/></linearGradient></defs><rect width='600' height='600' fill='url(%23g)'/><circle cx='300' cy='300' r='230' stroke='%23ff003c' stroke-width='3' fill='none' opacity='0.25'/><circle cx='300' cy='300' r='180' stroke='%2300f0ff' stroke-width='2' stroke-dasharray='8 6' fill='none' opacity='0.3'/><path d='M230 200 L370 200 L390 230 L210 230 Z' fill='%23ff003c' opacity='0.8'/><text x='300' y='325' font-family='sans-serif' font-weight='900' font-size='56' fill='%23ffffff' text-anchor='middle' letter-spacing='4'>STRAY KIDS</text><text x='300' y='365' font-family='sans-serif' font-weight='800' font-size='22' fill='url(%23glow)' text-anchor='middle' letter-spacing='10'>RADIO STREAM</text><rect x='150' y='410' width='300' height='4' fill='url(%23glow)' rx='2'/><text x='300' y='445' font-family='sans-serif' font-weight='700' font-size='15' fill='%239499ad' text-anchor='middle' letter-spacing='3'>ATE • 5-STAR • ROCK-STAR</text></svg>";

    // -------------------------------------------------------------------------
    // WEB AUDIO API: ECUALIZADOR LOGARÍTMICO CALIBRADO (BAILAN TODAS LAS BARRAS)
    // -------------------------------------------------------------------------
    const canvas = document.getElementById("equalizerCanvas");
    const ctx = canvas.getContext("2d");
    let audioCtx = null;
    let analyser = null;
    let dataArray = null;

    const NUM_BARS = 32;
    const peaks = new Array(NUM_BARS).fill(0);

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.minDecibels = -80;
        analyser.maxDecibels = -10;
        analyser.smoothingTimeConstant = 0.58;

        const source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function drawEqualizer() {
      requestAnimationFrame(drawEqualizer);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const totalWidth = canvas.width;
      const barSpacing = 3;
      const barWidth = Math.floor((totalWidth - (NUM_BARS - 1) * barSpacing) / NUM_BARS);

      if (!analyser || !isPlaying) {
        for (let i = 0; i < NUM_BARS; i++) {
          const x = i * (barWidth + barSpacing);
          const y = canvas.height - 3;
          ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
          ctx.fillRect(x, y, barWidth, 3);
        }
        return;
      }

      analyser.getByteFrequencyData(dataArray);

      // Rango acústico útil de MP3 (40 Hz hasta 14.5 kHz para evitar frecuencias vacías)
      const minIndex = 1;
      const maxIndex = Math.floor(dataArray.length * 0.65);

      for (let i = 0; i < NUM_BARS; i++) {
        // Distribución exponencial logarítmica que equilibra todas las frecuencias
        const fraction = i / (NUM_BARS - 1);
        const binIndex = Math.min(
          maxIndex,
          Math.floor(minIndex * Math.pow(maxIndex / minIndex, fraction))
        );

        let val = dataArray[binIndex] || 0;

        // Compensación de ganancia progresiva para agudos (las últimas 4 barras)
        const boost = 1 + Math.pow(fraction, 1.8) * 0.95;
        let norm = Math.min(1, (val / 255) * boost);

        let barHeight = Math.pow(norm, 1.2) * canvas.height * 1.35;
        barHeight = Math.max(4, Math.min(barHeight, canvas.height));

        const x = i * (barWidth + barSpacing);
        const y = canvas.height - barHeight;

        // Física rápida de picos
        if (barHeight >= peaks[i]) {
          peaks[i] = barHeight;
        } else {
          peaks[i] = Math.max(0, peaks[i] - 1.8);
        }

        const grad = ctx.createLinearGradient(0, canvas.height, 0, y);
        grad.addColorStop(0, "#ff003c");
        grad.addColorStop(0.55, "#ff2a6d");
        grad.addColorStop(1, "#00f0ff");

        ctx.fillStyle = grad;
        ctx.fillRect(x, y, barWidth, barHeight);

        // Tope pico luminoso blanco/cian
        if (peaks[i] > 5) {
          const peakY = canvas.height - peaks[i];
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(x, peakY - 3, barWidth, 2);
        }
      }
    }
    drawEqualizer();

    // -------------------------------------------------------------------------
    // TEXTO MARQUEE PING-PONG
    // -------------------------------------------------------------------------
    function updateTitleMarquee(title) {
      trackTitle.textContent = title;
      trackTitle.classList.remove("animate-marquee");
      trackTitle.style.transform = "translateX(0)";

      requestAnimationFrame(() => {
        const containerW = marqueeBox.clientWidth;
        const textW = trackTitle.scrollWidth;

        if (textW > containerW - 10) {
          const distance = -(textW - containerW + 24);
          trackTitle.style.setProperty("--scroll-distance", `${distance}px`);
          trackTitle.classList.add("animate-marquee");
        }
      });
    }

    // -------------------------------------------------------------------------
    // CARGA DE DATOS Y CATÁLOGO
    // -------------------------------------------------------------------------
    fetch('canciones.json')
      .then(res => res.json())
      .then(data => {
        TRACKS = data;
        renderCatalog();
      })
      .catch(err => {
        console.error("Error al cargar canciones.json:", err);
        updateTitleMarquee("Error cargando canciones.json");
      });

    btnShuffle.addEventListener("click", () => {
      isShuffle = !isShuffle;
      btnShuffle.classList.toggle("active", isShuffle);
      btnShuffle.title = isShuffle ? "Modo Aleatorio Activo" : "Modo Secuencial Activo";
    });

    function getRandomTrack() {
      if (TRACKS.length === 0) return null;
      let next;
      do {
        next = TRACKS[Math.floor(Math.random() * TRACKS.length)];
      } while (TRACKS.length > 1 && currentTrack && next.id === currentTrack.id);
      return next;
    }

    function getNextSequentialTrack() {
      if (TRACKS.length === 0) return null;
      if (!currentTrack) return TRACKS[0];
      const currentIndex = TRACKS.findIndex(t => t.id === currentTrack.id);
      const nextIndex = (currentIndex + 1) % TRACKS.length;
      return TRACKS[nextIndex];
    }

    function fetchOfficialCover(songTitle) {
      const cleanTitle = songTitle.replace(/[#_\(\)]/g, ' ').replace(/\s+/g, ' ').trim();
      
      if (coverCache[cleanTitle]) {
        coverImg.src = coverCache[cleanTitle];
        return;
      }

      const query = encodeURIComponent(`Stray Kids ${cleanTitle}`);
      fetch(`https://itunes.apple.com/search?term=${query}&media=music&entity=song&limit=1`)
        .then(res => res.json())
        .then(data => {
          if (data.results && data.results.length > 0) {
            const hiresCover = data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
            coverCache[cleanTitle] = hiresCover;
            coverImg.src = hiresCover;
          } else {
            coverImg.src = DEFAULT_SVG_COVER;
          }
        })
        .catch(() => {
          coverImg.src = DEFAULT_SVG_COVER;
        });
    }

    function playTrack(track, isFromQueue = false) {
      initAudioContext();

      if (currentTrack) history.push(currentTrack);
      currentTrack = track;

      let fileName = track.file.replace(/^audio[\\\/]/, '');
      audio.src = 'audio/' + encodeURIComponent(fileName);

      updateTitleMarquee(track.title);
      trackArtist.textContent = `${track.album || 'Stray Kids'} • ${track.artist || 'Stray Kids'}`;

      if (isFromQueue) {
        modeIndicator.textContent = "⚡ PETICIÓN PRIORITARIA";
        modeIndicator.style.color = "var(--skz-crimson)";
      } else {
        modeIndicator.textContent = isShuffle ? "AUTO-RADIO ALEATORIO" : "REPRODUCCIÓN CONTINUA";
        modeIndicator.style.color = "var(--accent-cyan)";
      }

      fetchOfficialCover(track.title);

      audio.play().then(() => {
        setPlaying(true);
      }).catch(err => {
        console.warn("Reproducción en espera:", err);
      });

      renderQueue();
    }

    function playNext() {
      if (queue.length > 0) {
        const nextInLine = queue.shift();
        playTrack(nextInLine, true);
      } else {
        const nextSong = isShuffle ? getRandomTrack() : getNextSequentialTrack();
        if (nextSong) playTrack(nextSong, false);
      }
    }

    window.requestSong = function(id) {
      const song = TRACKS.find(t => t.id === id);
      if (!song) return;

      if (!currentTrack || audio.paused) {
        playTrack(song, true);
      } else {
        queue.push(song);
        renderQueue();
      }
    };

    function setPlaying(playing) {
      isPlaying = playing;
      if (playing) {
        playerDeck.classList.add("is-playing");
        playIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
      } else {
        playerDeck.classList.remove("is-playing");
        playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
      }
    }

    btnPlay.addEventListener("click", () => {
      initAudioContext();
      if (!currentTrack) {
        playNext();
      } else if (audio.paused) {
        audio.play();
        setPlaying(true);
      } else {
        audio.pause();
        setPlaying(false);
      }
    });

    btnNext.addEventListener("click", () => {
      initAudioContext();
      playNext();
    });

    btnPrev.addEventListener("click", () => {
      initAudioContext();
      if (history.length > 0) {
        const prev = history.pop();
        playTrack(prev, false);
      }
    });

    audio.addEventListener("ended", playNext);

    // -------------------------------------------------------------------------
    // SCRUBBER DESLIZABLE
    // -------------------------------------------------------------------------
    function updateProgressUI(currentTime, duration) {
      if (!isNaN(duration) && duration > 0) {
        const pct = (currentTime / duration) * 100;
        progressFill.style.width = `${pct}%`;
        labelCurrent.textContent = formatTime(currentTime);
        labelTotal.textContent = formatTime(duration);
      }
    }

    audio.addEventListener("timeupdate", () => {
      if (!isDragging) {
        updateProgressUI(audio.currentTime, audio.duration);
      }
    });

    function seekFromEvent(e) {
      const rect = progressTrack.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      if (!isNaN(audio.duration)) {
        const targetTime = pos * audio.duration;
        updateProgressUI(targetTime, audio.duration);
        return targetTime;
      }
      return 0;
    }

    progressTrack.addEventListener("pointerdown", (e) => {
      isDragging = true;
      progressTrack.classList.add("is-dragging");
      progressTrack.setPointerCapture(e.pointerId);
      const targetTime = seekFromEvent(e);
      audio.currentTime = targetTime;
    });

    progressTrack.addEventListener("pointermove", (e) => {
      if (isDragging) {
        const targetTime = seekFromEvent(e);
        audio.currentTime = targetTime;
      }
    });

    function stopDragging(e) {
      if (isDragging) {
        isDragging = false;
        progressTrack.classList.remove("is-dragging");
        try {
          progressTrack.releasePointerCapture(e.pointerId);
        } catch (_) {}
      }
    }

    progressTrack.addEventListener("pointerup", stopDragging);
    progressTrack.addEventListener("pointercancel", stopDragging);

    // -------------------------------------------------------------------------
    // BARRA DE VOLUMEN CON CONTROL DINÁMICO
    // -------------------------------------------------------------------------
    function updateVolumeVisual(val) {
      audio.volume = val;
      const pct = Math.round(val * 100);
      volumeControl.style.background = `linear-gradient(to right, var(--skz-crimson) ${pct}%, rgba(255, 255, 255, 0.1) ${pct}%)`;
    }

    volumeControl.addEventListener("input", (e) => {
      updateVolumeVisual(parseFloat(e.target.value));
    });

    volMuteBtn.addEventListener("click", () => {
      volumeControl.value = 0;
      updateVolumeVisual(0);
    });

    volMaxBtn.addEventListener("click", () => {
      volumeControl.value = 1;
      updateVolumeVisual(1);
    });

    function formatTime(s) {
      const mins = Math.floor(s / 60) || 0;
      const secs = Math.floor(s % 60) || 0;
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // -------------------------------------------------------------------------
    // PESTAÑAS Y CATÁLOGO CON BOTÓN 'X' DE LIMPIEZA
    // -------------------------------------------------------------------------
    tabCatalog.addEventListener("click", () => {
      tabCatalog.classList.add("active");
      tabQueue.classList.remove("active");
      catalogView.style.display = "flex";
      queueView.style.display = "none";
      searchField.parentElement.style.display = "flex";
    });

    tabQueue.addEventListener("click", () => {
      tabQueue.classList.add("active");
      tabCatalog.classList.remove("active");
      queueView.style.display = "flex";
      catalogView.style.display = "none";
      searchField.parentElement.style.display = "none";
    });

    function renderCatalog(filter = "") {
      catalogView.innerHTML = "";
      const q = filter.toLowerCase();
      const filtered = TRACKS.filter(t => t.title.toLowerCase().includes(q) || (t.album && t.album.toLowerCase().includes(q)));

      filtered.forEach((t, idx) => {
        const li = document.createElement("li");
        li.className = "track-row";
        li.innerHTML = `
          <div class="row-main">
            <span class="row-index">${(idx + 1).toString().padStart(2, '0')}</span>
            <div class="row-details">
              <div class="row-name">${t.title}</div>
              <div class="row-sub">${t.album || 'Stray Kids'} • ${t.artist || 'Stray Kids'}</div>
            </div>
          </div>
          <button class="btn-add-queue" onclick="requestSong(${t.id})">+ PEDIR</button>
        `;
        catalogView.appendChild(li);
      });
    }

    function renderQueue() {
      queueBadge.textContent = queue.length;
      queueView.innerHTML = "";

      if (queue.length === 0) {
        queueView.innerHTML = `
          <li style="text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px;">
            No hay canciones en cola.<br>Sonando en modo Auto-Radio aleatorio.
          </li>
        `;
        return;
      }

      queue.forEach((t, idx) => {
        const li = document.createElement("li");
        li.className = "track-row";
        li.innerHTML = `
          <div class="row-main">
            <span class="row-index" style="color: var(--skz-crimson)">#${idx + 1}</span>
            <div class="row-details">
              <div class="row-name">${t.title}</div>
              <div class="row-sub">${t.album || 'Stray Kids'}</div>
            </div>
          </div>
          <span style="font-size: 12px; font-weight: 700; color: var(--skz-crimson); padding-right: 8px;">EN TURNO</span>
        `;
        queueView.appendChild(li);
      });
    }

    searchField.addEventListener("input", (e) => {
      const val = e.target.value;
      btnClearSearch.style.display = val.length > 0 ? "flex" : "none";
      renderCatalog(val);
    });

    btnClearSearch.addEventListener("click", () => {
      searchField.value = "";
      btnClearSearch.style.display = "none";
      searchField.focus();
      renderCatalog("");
    });
  </script>
</body>
